name: Build Aura

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: Aura-Windows
          # macOS gets one native build per architecture. The dependency stack
          # (numpy, cryptography, pydantic-core) ships no universal2 wheels, so
          # a single fat binary cannot be built.
          - os: macos-latest
            artifact: Aura-macOS-AppleSilicon
            expect_arch: arm64
          - os: macos-15-intel
            artifact: Aura-macOS-Intel
            expect_arch: x86_64
          - os: ubuntu-latest
            artifact: Aura-Linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0

      - name: Generate macOS icon
        if: runner.os == 'macOS'
        run: bash scripts/build_icns.sh

      - name: Build with PyInstaller
        run: python scripts/build.py

      - name: Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AURA_VERSION: ${{ github.ref_name }}
        run: |
          $stage = "installers/windows/installer-in"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse -Force dist/Aura/* $stage
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installers/windows/aura.iss
          New-Item -ItemType Directory -Force -Path installer-out | Out-Null
          Copy-Item installers/windows/installer-out/AuraSetup.exe installer-out/AuraSetup.exe

      - name: Verify macOS binary architecture
        if: runner.os == 'macOS'
        run: |
          binary="dist/Aura.app/Contents/MacOS/Aura"
          archs="$(lipo -archs "$binary")"
          echo "$binary -> $archs (expected ${{ matrix.expect_arch }})"
          if [ "$archs" != "${{ matrix.expect_arch }}" ]; then
            echo "::error::built ${archs}, expected ${{ matrix.expect_arch }}" >&2
            exit 1
          fi

      - name: macOS DMG
        if: runner.os == 'macOS'
        env:
          AURA_VERSION: ${{ github.ref_name }}
        run: |
          bash installers/macos/make_dmg.sh dist/Aura.app
          mkdir -p installer-out
          mv Aura-macOS-*.dmg installer-out/

      - name: Linux self-extracting installer
        if: runner.os == 'Linux'
        env:
          AURA_VERSION: ${{ github.ref_name }}
        run: |
          bash installers/linux/make_installer.sh dist/Aura
          mkdir -p installer-out
          mv Aura-Linux-Installer.run installer-out/

      - name: Upload raw app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-Installer
          path: installer-out/

  build-headless:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: Aura-Server-Linux-x64
          - os: ubuntu-24.04-arm
            artifact: Aura-RaspberryPi-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements-headless.txt
          pip install pyinstaller

      - name: Build headless CLI
        run: pyinstaller aura-cli.spec --noconfirm

      - name: Package tarball
        run: |
          cd dist
          tar -czf "../${{ matrix.artifact }}.tar.gz" aura-cli

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-headless]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: actions/checkout@v4
        with:
          path: repo

      - name: Package artifacts
        run: |
          cd artifacts
          for d in */; do
            name="${d%/}"
            # Installer bundles: publish the installer file directly. Check
            # each glob so a non-matching pattern does not fail the test.
            if ls "$d"*.exe "$d"*.dmg "$d"*.run 2>/dev/null | grep -q .; then
              mv "$d"*.exe "$d"*.dmg "$d"*.run . 2>/dev/null || true
            elif ls "$d"*.tar.gz > /dev/null 2>&1; then
              mv "$d"*.tar.gz .
            else
              (cd "$d" && zip -r "../${name}.zip" .)
            fi
          done
          # Headless one-line installer, shipped as a release asset too.
          cp ../repo/installers/server/install.sh aura-server-install.sh
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.run
            artifacts/aura-server-install.sh
          generate_release_notes: true