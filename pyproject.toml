[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-app"
version = "2.0.0"
description = "AI-Powered Local Sales Agent"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "SQLAlchemy==2.0.40",
    "litellm==1.72.5",
    "playwright==1.52.0",
    "beautifulsoup4==4.13.4",
    "httpx==0.28.1",
    "cryptography==45.0.3",
    "py-machineid==0.6.0",
    "resend==2.7.0",
    "packaging==24.2",
    "lxml==5.4.0",
    "pytrends==4.9.4",
    "playwright-stealth==1.0.6",
    "openpyxl==3.1.5",
    "python-whois==0.9.4",
    "dnspython==2.7.0",
]

[project.optional-dependencies]
gui = [
    "PySide6==6.8.3",
    "qtawesome==1.4.0",
]
discord = ["discord.py==2.4.0"]
voice = [
    "twilio>=9.0.0",
    "elevenlabs>=1.0.0",
    "faster-whisper>=1.0.0",
]
pdf = ["reportlab>=4.0.0"]
all = [
    "PySide6==6.8.3",
    "qtawesome==1.4.0",
    "discord.py==2.4.0",
    "twilio>=9.0.0",
    "elevenlabs>=1.0.0",
    "faster-whisper>=1.0.0",
    "reportlab>=4.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.0.0",
]

[project.scripts]
aura = "cli:main"
aura-gui = "main:main"

[tool.setuptools]
py-modules = ["cli", "config", "main"]

[tool.setuptools.packages.find]
include = ["core*", "database*", "controllers*", "ui*", "utils*"]
