[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "aura-app"
version = "1.2.0"
description = "AI-Powered Local Sales Agent"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "PySide6==6.8.3",
    "SQLAlchemy==2.0.40",
    "litellm==1.72.5",
    "playwright==1.52.0",
    "beautifulsoup4==4.13.4",
    "httpx==0.28.1",
    "cryptography==45.0.3",
    "py-machineid==0.6.0",
    "resend==2.7.0",
    "packaging==24.2",
    "lxml==5.4.0",
    "pytrends==4.9.4",
    "qtawesome==1.4.0",
    "playwright-stealth==1.0.6",
]

[project.optional-dependencies]
cli = []  # CLI has no extra deps — same core deps minus PySide6/qtawesome
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.0.0",
]

[project.scripts]
aura = "cli:main"
aura-gui = "main:main"

[tool.setuptools.packages.find]
include = ["core*", "database*", "controllers*", "ui*", "utils*"]
