[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-app"
version = "2.6.3"
description = "AI-Powered Local Sales Agent"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "SQLAlchemy==2.0.46",
    "litellm==1.81.13",
    "playwright==1.58.0",
    "beautifulsoup4==4.14.3",
    "httpx==0.28.1",
    "brotli==1.2.0",
    "cryptography==46.0.5",
    "py-machineid==1.0.0",
    "resend==2.22.0",
    "packaging==26.0",
    "lxml==6.0.2",
    "pytrends==4.9.2",
    "playwright-stealth==1.0.6",
    "openpyxl==3.1.5",
    "python-whois==0.9.4",
    "dnspython==2.7.0",
]

[project.optional-dependencies]
gui = [
    "PySide6==6.10.2",
    "qtawesome==1.4.1",
    'pyobjc-framework-Cocoa==12.2.1; sys_platform == "darwin"',
]
discord = ["discord.py==2.6.4"]
telegram = ["python-telegram-bot>=21.0"]
voice = [
    "twilio>=9.0.0",
    "elevenlabs>=1.0.0",
    "faster-whisper>=1.0.0",
]
pdf = ["reportlab>=4.0.0"]
all = [
    "PySide6==6.10.2",
    "qtawesome==1.4.1",
    'pyobjc-framework-Cocoa==12.2.1; sys_platform == "darwin"',
    "discord.py==2.6.4",
    "python-telegram-bot>=21.0",
    "twilio>=9.0.0",
    "elevenlabs>=1.0.0",
    "faster-whisper>=1.0.0",
    "reportlab>=4.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.0.0",
]

[project.scripts]
aura = "cli:main"
aura-gui = "main:main"

[tool.setuptools]
py-modules = ["cli", "config", "main"]

[tool.setuptools.packages.find]
include = ["core*", "database*", "controllers*", "ui*", "utils*"]
